<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07060f" />
    <title>Lichess Recap</title>
    <link rel="icon" href="../logo/lichess-favicon-32.png" />
    <link rel="stylesheet" href="recap.css" />
  </head>
  <body>
    <div id="recap">
      <canvas id="bg" aria-hidden="true"></canvas>
      <div class="blobs" aria-hidden="true">
        <div class="blob blob--a"></div>
        <div class="blob blob--b"></div>
        <div class="blob blob--c"></div>
      </div>
      <div class="grain" aria-hidden="true"></div>

      <header class="hud">
        <div class="progress" id="progress"></div>
        <div class="hud__bar">
          <img class="hud__logo" src="../logo/lichess-white.svg" alt="Lichess" />
          <span class="hud__title" id="hud-title"></span>
          <button class="hud__btn" id="btn-pause" aria-label="Pause">
            <svg viewBox="0 0 24 24"><path class="i-pause" d="M7 5h3v14H7zM14 5h3v14h-3z" /><path class="i-play" d="M8 5l11 7-11 7z" /></svg>
          </button>
        </div>
      </header>

      <main id="stage" aria-live="polite"></main>

      <button class="nav nav--prev" id="nav-prev" aria-label="Previous">‹</button>
      <button class="nav nav--next" id="nav-next" aria-label="Next">›</button>
    </div>

    <script src="data.js"></script>
    <script src="chess.js"></script>
    <script src="recap.js"></script>
  </body>
</html>
