name: Translation dest guard

on:
  pull_request:
    paths:
      - 'translation/dest/**'

jobs:
  block-manual-dest-changes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Reject manual changes to translation/dest
        run: |
          echo "Files in \`translation/dest\` are generated by Crowdin and must not be modified. Otherwise your changes will be overwritten on the next sync. Please make them on Crowdin instead."
          exit 1
