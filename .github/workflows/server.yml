name: Build server

on:
  push:
    paths:
      - '.github/workflows/server.yml'
      - 'app/**'
      - 'conf/**'
      - 'modules/**'
      - 'project/**'
      - 'translation/**'
      - 'build.sbt'
      - 'lila.sh'
      - 'conf/application.conf.default'
      - '.sbtopts.default'
    branches-ignore:
      - 'l10n_master'
  pull_request:
    paths:
      - '.github/workflows/server.yml'
      - 'app/**'
      - 'conf/**'
      - 'modules/**'
      - 'project/**'
      - 'translation/source/**'
      - 'build.sbt'
      - 'lila.sh'
      - 'conf/application.conf.default'
      - '.sbtopts.default'
  workflow_dispatch:
  workflow_call:
    inputs:
      skip_format:
        description: Skip the format-check job
        type: boolean
        default: true
        required: false

jobs:
  build:
    runs-on: depot-ubuntu-24.04-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
          cache: sbt
      - name: Setup sbt
        uses: sbt/setup-sbt@67d461eba2c4753196c230e02da850757ba4775e # v1.5.14
      - run: TZ=UTC git log -1 --date=iso-strict-local --pretty='format:app.version.commit = "%H"%napp.version.date = "%ad"' | tee conf/version.conf
      - run: ./lila.sh -Depoll=true "test;stage"
      - name: Debug target symlinks
        if: always()
        run: |
          inspect_symlinks() {
            local root=$1
            [ -e "$root" ] || { echo "$root: missing"; return 0; }
            echo "::group::$root"
            echo "resolved: $(readlink -f "$root")"
            du -sh "$root"
            echo "files: $(find "$root" -type f | wc -l)  dirs: $(find "$root" -type d | wc -l)  symlinks: $(find "$root" -type l | wc -l)  broken: $(find -L "$root" -type l | wc -l)"
            echo "--- symlinks by containing dir"
            find "$root" -type l -printf '%h\n' | sort | uniq -c | sort -rn | head -40
            echo "--- final destinations by root (readlink -f, first 6 path components)"
            find "$root" -type l -exec readlink -f {} + | cut -d/ -f1-6 | sort | uniq -c | sort -rn | head -40
            echo "--- symlinks whose first hop is itself a symlink: $(find "$root" -type l -exec sh -c 'for l; do t=$(readlink "$l"); case $t in /*) ;; *) t=$(dirname "$l")/$t;; esac; [ -L "$t" ] && echo "$l"; done' sh {} + | wc -l)"
            echo "--- sample"
            find "$root" -type l -printf '%p -> %l\n' | head -30
            echo "::endgroup::"
          }
          echo "workspace: $PWD  home: $HOME"
          echo "::group::target directories in workspace"
          find . -name node_modules -prune -o -name .git -prune -o -type d -name target -prune -print
          echo "::endgroup::"
          echo "::group::candidate sbt cache dirs"
          du -sh ~/.cache/sbt ~/.cache/sbt/* ~/.sbt ~/.ivy2 ~/.cache/coursier 2>&1 || true
          echo "::endgroup::"
          inspect_symlinks target
          inspect_symlinks project/target
      - run: cp LICENSE COPYING.md README.md target/universal/stage && git log -n 1 --pretty=oneline > target/universal/stage/commit.txt
      - run: cd target/universal/stage && tar --zstd -cvpf ../../../lila-3.0.tar.zst . && cd -
        env:
          ZSTD_LEVEL: 1 # most files are already zipped
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lila-server
          path: lila-3.0.tar.zst
          compression-level: 0 # already compressed

  format:
    if: inputs.skip_format != true
    runs-on: depot-ubuntu-24.04-4
    env:
      SBT_OPTS: -Dsbt.banner=false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
          cache: sbt
      - name: Setup sbt
        uses: sbt/setup-sbt@67d461eba2c4753196c230e02da850757ba4775e # v1.5.14

      - name: Check Formatting
        run: sbt scalafmtCheckAll
