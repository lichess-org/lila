name: Preview

on:
  workflow_run:
    workflows: ['Build server', 'Build assets']
    types: [completed]

jobs:
  gate:
    runs-on: ubuntu-latest
    if: |
      github.repository_owner == 'lichess-org' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    steps:
      - run: |
          echo "Building preview"

  params:
    needs: [gate]
    if: needs.gate.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.params.outputs.tags }}
      ref: ${{ steps.params.outputs.ref }}
    steps:
      - name: Work out tags and ref
        id: params
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // Docker tags may only contain [a-zA-Z0-9_.-]
            const sanitizeTag = (value) => value.replace(/[^a-zA-Z0-9_.-]/g, '-');

            const branch = context.payload.workflow_run.head_branch;
            const tags = [`type=raw,value=${sanitizeTag(branch)}`, 'type=raw,value=latest'];

            core.setOutput('tags', tags.join('\n'));
            core.setOutput('ref', context.payload.workflow_run.head_sha);

  publish-server:
    needs: [gate, params]
    if: |
      always() &&
      needs.gate.result == 'success' &&
      github.event.workflow_run.name == 'Build server'
    runs-on: ubuntu-latest
    concurrency:
      group: docker-publish-server-${{ needs.params.outputs.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.params.outputs.ref }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lila-server
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract artifact
        run: |
          mkdir -p lila
          tar --zstd -xvf *.tar.zst -C lila

      - name: Copy conf
        run: cp -r conf lila

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}-server
          tags: ${{ needs.params.outputs.tags }}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: .github/workflows/docker/lila.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish-assets:
    needs: [gate, params]
    if: |
      always() &&
      needs.gate.result == 'success' &&
      github.event.workflow_run.name == 'Build assets'
    runs-on: ubuntu-latest
    concurrency:
      group: docker-publish-assets-${{ needs.params.outputs.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.params.outputs.ref }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lila-assets
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract assets
        run: |
          mkdir -p assets
          tar --zstd -xvf assets.tar.zst -C assets

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}-assets
          tags: ${{ needs.params.outputs.tags }}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: .github/workflows/docker/assets.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-server:
    name: deploy preview (server)
    if: |
      always() &&
      needs.publish-server.result == 'success'
    needs: [publish-server]
    uses: lichess-org/.github/.github/workflows/deploy.yml@main
    secrets:
      deploy_webhook_url: ${{ secrets.DEPLOY_PREVIEW_SERVER_URL }}

  deploy-assets:
    name: deploy preview (assets)
    if: |
      always() &&
      needs.publish-assets.result == 'success'
    needs: [publish-assets]
    uses: lichess-org/.github/.github/workflows/deploy.yml@main
    secrets:
      deploy_webhook_url: ${{ secrets.DEPLOY_PREVIEW_ASSETS_URL }}
