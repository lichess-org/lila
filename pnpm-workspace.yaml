  - '@ox*/*-arm-*'
  - '@ox*/*-ia32-*'
  - '@ox*/*-loong64-*'
  - '@ox*/*-mips64el-*'
  - '@ox*/*-ppc64-*'
  - '@ox*/*-riscv64-*'
  - '@ox*/*-s390x-*'
  - '@ox*/*-aix-*'
  - '@ox*/*-android-*'
  - '@ox*/*-freebsd-*'
  - '@ox*/*-openbsd-*'
  - '@ox*/*-openharmony-*'
  - '@ox*/*-netbsd-*'
  - '@ox*/*-sunos-*'
allowBuilds:
  chessground3D@https://codeload.github.com/yafred/chessground3D/tar.gz/8f73630f2f35eaa21affc4291f630e7010eed3c1: true
  esbuild: true
overrides:
  fast-uri: ^3.1.7
  undici: ^8.10.2
patchedDependencies:
